user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression — especially important for large JSON API responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    upstream flask {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    # Tile cache — /api/tile responses are immutable per archive build (ETag'd
    # by file mtime+size); caching them here keeps repeated viewports off gunicorn.
    proxy_cache_path /tmp/nginx-tiles levels=1:2 keys_zone=tiles:16m
                     max_size=256m inactive=7d use_temp_path=off;

    server {
        listen 8080;

        root /var/www/html;
        index index.html;

        # Content-hashed build assets — safe to cache forever (immutable).
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            # index.html / SPA shell must revalidate so new builds are picked up.
            add_header Cache-Control "no-cache";
        }

        location /api/tile/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache tiles;
            proxy_cache_valid 200 204 1d;
            proxy_cache_key $uri$is_args$args$http_accept_encoding;
            add_header X-Tile-Cache $upstream_cache_status;
        }

        location /api/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # First request to a city lazily loads its walk graph (NYC ~50s);
            # allow up to Cloud Run's request timeout instead of nginx's 60s
            # default so cold loads return 200 instead of 504.
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location /health {
            proxy_pass http://flask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        # PMTiles — served as static files with range request support
        location /tiles/ {
            root /var/www/html;
            add_header Cache-Control "public, max-age=604800";
            add_header Access-Control-Allow-Origin *;
        }

        # Serve ws.js explicitly as static file (before /ws prefix match)
        location = /ws.js {
            root /var/www/html;
        }
    }
}