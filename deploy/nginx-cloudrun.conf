user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# This custom config replaces Debian's default, so it doesn't auto-include
# /etc/nginx/modules-enabled/*.conf — load the brotli modules explicitly.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression — especially important for large JSON API responses.
    # brotli is preferred when the client advertises it (Accept-Encoding: br);
    # gzip stays as the fallback for clients that don't. octet-stream covers the
    # binary graph topology (/api/graph-topology?format=bin): ~37MB raw → ~16MB
    # gzipped / ~13MB brotli, keeping it under Cloud Run's 32MB response cap.
    brotli on;
    brotli_comp_level 5;
    brotli_types application/json application/octet-stream text/plain text/css application/javascript;
    brotli_min_length 256;

    gzip on;
    gzip_types application/json application/octet-stream text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    # Staging (service name ce-stg-<token> → host ce-stg-….a.run.app) must never
    # be indexed — the unguessable URL is the access control. nginx omits an
    # add_header whose value is empty, so on prod hosts this is a no-op. Flask
    # adds the same header to proxied responses when APP_ENV=staging; this map
    # covers the statics nginx serves itself (SPA shell, /assets, pmtiles).
    map $host $staging_robots {
        default "";
        "~^ce-stg-" "noindex, nofollow";
    }

    upstream flask {
        server 127.0.0.1:5001;
        keepalive 32;
        # Retire pooled connections BEFORE gunicorn's --keep-alive 75 does: if
        # gunicorn closes first, a request racing the FIN gets "upstream
        # prematurely closed" — and POSTs (votes) are never retried.
        keepalive_timeout 55s;
    }

    # Tile cache — /api/tile responses are immutable per archive bake (the URL
    # carries a ?v= cache-buster and a strong ETag); caching them here keeps
    # repeated viewports off gunicorn. On Cloud Run /tmp is tmpfs (counts
    # against instance memory), so the cache is capped small.
    proxy_cache_path /tmp/nginx-tiles levels=1:2 keys_zone=tiles:16m
                     max_size=128m inactive=7d use_temp_path=off;

    # donate.cityedit.org maps to this service like every other subdomain
    # (terraform custom_domains); it exists only to redirect to the donation
    # page, so answer it here before the catch-all app server.
    server {
        listen 8080;
        server_name donate.cityedit.org;
        # $is_args$args forwards the query string, which a literal `return`
        # target otherwise drops. Proposal cards link here carrying UTM
        # parameters naming the proposal being funded (see donateLink.ts);
        # Donorbox stamps those onto the donation record, so losing them here
        # would silently strip every donation of what it was for.
        return 301 https://donorbox.org/support-spherical-harmonics$is_args$args;
    }

    # feedback.cityedit.org serves only the static feedback form (baked into
    # the client build as /feedback.html); every path lands on the form.
    server {
        listen 8080;
        server_name feedback.cityedit.org;
        root /var/www/html;

        location / {
            try_files /feedback.html =404;
            add_header Cache-Control "no-cache";
        }
    }

    server {
        listen 8080 default_server;

        root /var/www/html;
        index index.html;

        # Repeated inside every location that declares its own add_header —
        # nginx's add_header inheritance is all-or-nothing, so a location-level
        # add_header would otherwise drop this one.
        add_header X-Robots-Tag $staging_robots always;

        # Content-hashed build assets — safe to cache forever (immutable).
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag $staging_robots always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            # index.html / SPA shell must revalidate so new builds are picked up.
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag $staging_robots always;
        }

        # Map previews are captured daily into a private GCS bucket and streamed
        # by Flask (the project enforces Public Access Prevention, so the bucket
        # can't be public). If Flask 404s — bucket miss, no slug yet, token
        # failure — fall back to the build-time baked PNG under /var/www/html.
        location /previews/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @baked_previews;
        }

        location @baked_previews {
            root /var/www/html;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Robots-Tag $staging_robots always;
        }

        # Per-city PMTiles live at /api/tiles/<city>/graph.pmtiles (same URL Flask
        # serves locally), but in prod they're baked into the image, so serve them
        # straight from disk with nginx's native range support instead of proxying
        # multi-MB files through the Python workers. Regex matches before the /api/
        # prefix below; non-pmtiles /api/tiles/* still falls through to Flask.
        location ~ ^/api/tiles/(.+\.pmtiles)$ {
            alias /app/osm_data/$1;
            add_header Cache-Control "public, max-age=604800";
            add_header Access-Control-Allow-Origin *;
            add_header X-Robots-Tag $staging_robots always;
        }

        location /api/tile/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache tiles;
            # 204 = empty tile (outside blocks coverage) — cache those too.
            proxy_cache_valid 200 204 7d;
            proxy_cache_key $uri$is_args$args$http_accept_encoding;
            # Collapse a cold-instance tile stampede to one upstream request
            # per tile; timeouts match /api/ — a lazy city graph load freezes
            # the single gevent worker (NYC ~50s+) and would 504 at the 60s
            # default, leaving MapLibre with errored tiles until a zoom.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            add_header X-Tile-Cache $upstream_cache_status;
        }

        location /api/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # First request to a city lazily loads its walk graph (NYC ~50s);
            # allow up to Cloud Run's request timeout instead of nginx's 60s
            # default so cold loads return 200 instead of 504.
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location /health {
            proxy_pass http://flask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        # Serve ws.js explicitly as static file (before /ws prefix match)
        location = /ws.js {
            root /var/www/html;
        }
    }
}