[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --timeout 600: loading a city graph (pickle.load of the ~318MB NYC graph) holds
# the GIL for tens of seconds, freezing the gevent hub so the worker can't heartbeat.
# The default 120s killed the worker mid-warmup → restart loop. 600s lets the
# background warmup (and any lazy first-load) finish before the arbiter intervenes.
[program:gunicorn]
command=gunicorn -b 127.0.0.1:5001 --worker-class gevent --workers 1 --worker-connections 2000 --keep-alive 75 --graceful-timeout 600 --timeout 600 app:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PATH="/usr/local/bin:%(ENV_PATH)s"
stopwaitsecs=600

[program:healthcheck]
command=/bin/bash /app/deploy/healthcheck.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0