steps:
  # ── Merged OSRM image (built in parallel with the app; data baked in) ────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-osrm'
    waitFor: ['-']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:latest'
      - 'osrm'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-osrm'
    waitFor: ['build-osrm']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm'

  # Deploy OSRM first so the app's OSRM_URL target is live before the app rolls.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-osrm'
    waitFor: ['push-osrm']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'desire-path-osrm'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:${BUILD_ID}'
      - '--region=${_REGION}'

  # ── App image ────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-app'
    waitFor: ['-']
    args:
      - 'build'
      - '--no-cache'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/app:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/app:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-app'
    waitFor: ['build-app']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/app'

  # Deploy to Cloud Run (update image only, preserve env vars from terraform)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-app'
    waitFor: ['push-app', 'deploy-osrm']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'desire-path-mapper'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/app:${BUILD_ID}'
      - '--region=${_REGION}'

# Building three city walk graphs (osmnx) sequentially exceeds the default
# 10-minute build timeout.
timeout: '7200s'

options:
  # Building the full NYC walk graph (osmnx) is memory-hungry; the default
  # e2-medium worker (~4GB) OOM-kills refresh_osm.py. Use a high-memory worker.
  machineType: 'E2_HIGHCPU_32'

substitutions:
  _REGION: us-central1

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/app:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:latest'
