name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The binding check runs on EVERY push and PR, whether or not docs changed —
  # the whole point is to catch a code change that left a dossier behind.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the coupling check needs the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check algorithm dossiers against the source
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "${{ github.base_ref }}"
            python3 scripts/check_algorithm_docs.py --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/check_algorithm_docs.py
          fi

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
