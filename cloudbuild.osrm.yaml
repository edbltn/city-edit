# Build + push ONLY the merged OSRM image (4-city dataset incl. DC).
# Standalone so it doesn't contend with the heavy app graph build (which caused
# the combined build to hit the 1h timeout). osrm-extract/customize on the merged
# foot dataset is memory-hungry, so use a high-mem worker.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:latest'
      - 'osrm'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:latest']

timeout: '2400s'

options:
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REGION: us-central1

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/desire-path-mapper/osrm:latest'
