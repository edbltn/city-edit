services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: votes
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d votes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single merged-OSRM serving every city from one dataset (NYC + SF + Chicago,
  # each clipped to its bbox and osmium-merged). Mirrors the prod osrm Cloud Run
  # service. Data is baked into the image at build time, so there's no boot-time
  # download/build — the container is ready in seconds.
  osrm:
    build: ./osrm
    restart: unless-stopped
    mem_limit: 4g
    # No healthcheck: the osrm-backend runtime image ships neither curl nor wget,
    # so the old wget-based probe could never pass and pinned the container to
    # "unhealthy" even while it served routes fine. Flask depends_on osrm with
    # service_started (not service_healthy), so a probe isn't required here.

  flask:
    build: ./server
    restart: unless-stopped
    mem_limit: 4g
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://app:devpassword@postgres:5432/votes
      # All cities route through the single merged OSRM service.
      - OSRM_URL=http://osrm:5000
    env_file:
      - ./server/.env
    depends_on:
      - redis
      - postgres
      - osrm
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - osm-data:/app/osm_data

  # OSM data builder and weekly refresh sidecar
  osm-refresh:
    build: ./server
    command: |
      sh -c "
        echo 'OSM refresh service started'

        # Build any missing per-city graphs + their PMTiles on first startup.
        # PMTiles use the 'dev' profile (full coverage, lighter zoom band) so the
        # local background network matches prod's content — just a touch coarser.
        echo 'Building missing city graphs...'
        python refresh_osm.py --all 2>&1
        echo 'Building per-city PMTiles (dev profile)...'
        python build_pmtiles.py --all --profile dev 2>&1
        echo 'Building per-city place labels...'
        python build_place_labels.py --all 2>&1
        echo 'Initial graph + tile build complete'

        # Weekly refresh loop
        while true; do
          # Run Sunday at 3am (UTC)
          current_day=$$(date +%u)
          current_hour=$$(date +%H)
          if [ \"$$current_day\" = \"7\" ] && [ \"$$current_hour\" = \"03\" ]; then
            echo 'Starting weekly OSM refresh...'
            python refresh_osm.py --all --force 2>&1
            python build_pmtiles.py --all --profile dev --force 2>&1
            python build_place_labels.py --all --force 2>&1
            # Sleep for 1 hour to avoid running again
            sleep 3600
          fi
          # Check every hour
          sleep 3600
        done
      "
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./server/.env
    volumes:
      - osm-data:/app/osm_data
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    build: ./client-react
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask

volumes:
  redis-data:
  postgres-data:
  osm-data:
