services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: votes
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d votes"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm-nyc:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - osrm-nyc-data:/data
      - ./osrm/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    environment:
      - OSRM_PROFILE=foot
      - OSRM_PBF_URL=https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  osrm-sf:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - osrm-sf-data:/data
      - ./osrm/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    environment:
      - OSRM_PROFILE=foot
      # BBBike per-city extract — already clipped to the SF bbox.
      - OSRM_PBF_URL=https://download.bbbike.org/osm/bbbike/SanFrancisco/SanFrancisco.osm.pbf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  osrm-chicago:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - osrm-chicago-data:/data
      - ./osrm/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    environment:
      - OSRM_PROFILE=foot
      - OSRM_PBF_URL=https://download.bbbike.org/osm/bbbike/Chicago/Chicago.osm.pbf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  flask:
    build: ./server
    restart: unless-stopped
    mem_limit: 4g
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://app:devpassword@postgres:5432/votes
      # Per-city OSRM hosts default to service names in cities.py; override here if needed.
    env_file:
      - ./server/.env
    depends_on:
      - redis
      - postgres
      - osrm-nyc
      - osrm-sf
      - osrm-chicago
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - osm-data:/app/osm_data

  # OSM data builder and weekly refresh sidecar
  osm-refresh:
    build: ./server
    command: |
      sh -c "
        echo 'OSM refresh service started'

        # Build any missing per-city graphs on first startup
        echo 'Building missing city graphs...'
        python refresh_osm.py --all 2>&1
        echo 'Initial graph build complete'

        # Weekly refresh loop
        while true; do
          # Run Sunday at 3am (UTC)
          current_day=$$(date +%u)
          current_hour=$$(date +%H)
          if [ \"$$current_day\" = \"7\" ] && [ \"$$current_hour\" = \"03\" ]; then
            echo 'Starting weekly OSM refresh...'
            python refresh_osm.py --all --force 2>&1
            # Sleep for 1 hour to avoid running again
            sleep 3600
          fi
          # Check every hour
          sleep 3600
        done
      "
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./server/.env
    volumes:
      - osm-data:/app/osm_data
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    build: ./client-react
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask

volumes:
  redis-data:
  postgres-data:
  osm-data:
  osrm-nyc-data:
  osrm-sf-data:
  osrm-chicago-data:
