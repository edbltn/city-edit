services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  flask:
    build: ./server
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./server/.env
    depends_on:
      - redis
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
