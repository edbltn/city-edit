<title>City Edit — Merch</title>

<style>
  @font-face {
    font-family: "Red Hat Mono";
    src: url("{{FONT}}") format("woff2");
    font-weight: 300 700;
    font-display: block;
  }

  /* Dark-first: this proofs prints for a product whose whole identity is a
     terminal. The light palette is the app's own light basemap theme, so a
     light-mode reader gets City Edit's other real skin. */
  :root {
    color-scheme: dark;
    --paper: #0d0d0d;
    --ink: #d4d4d4;
    --ink-strong: #ffffff;
    --ink-quiet: #86867e;
    --hairline: rgba(212, 212, 212, 0.28);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --paper: #f4f5f0;
      --ink: #2b2b28;
      --ink-strong: #000000;
      --ink-quiet: #6d6d64;
      --hairline: rgba(40, 40, 35, 0.3);
    }
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f4f5f0;
    --ink: #2b2b28;
    --ink-strong: #000000;
    --ink-quiet: #6d6d64;
    --hairline: rgba(40, 40, 35, 0.3);
  }

  /* Blank colours are product data — they hold in both themes, because they
     are what actually gets printed on. */
  :root {
    --garment-black: #17171a;
    --garment-white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(36px, 7vw, 76px) clamp(16px, 5vw, 64px) clamp(48px, 8vw, 96px);
    background: var(--paper);
    color: var(--ink);
    font-family: "Red Hat Mono", ui-monospace, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(34px, 6vw, 64px);
  }

  header { display: flex; align-items: center; gap: 20px; }
  header .mark { width: clamp(52px, 8vw, 76px); color: var(--ink); flex: none; }
  header .mark svg { width: 100%; height: auto; display: block; }
  header h1 {
    margin: 0;
    font-size: clamp(20px, 3.4vw, 30px);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-strong);
  }
  header p {
    margin: 2px 0 0;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  section { display: flex; flex-direction: column; gap: clamp(18px, 3vw, 26px); }

  hgroup { padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }
  hgroup h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-strong);
  }
  hgroup p {
    margin: 3px 0 0;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  .pair {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(18px, 3vw, 28px);
  }

  figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  figure .art { padding: clamp(14px, 2.6vw, 28px); background: var(--ground); }
  figure img { display: block; width: 100%; height: auto; }

  figcaption {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }
  figcaption b { color: var(--ink-strong); font-weight: 600; }
  figcaption::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
</style>

<div class="sheet">

  <header>
    <div class="mark">{{MARK}}</div>
    <div>
      <h1>Merch</h1>
      <p>City Edit · 2 designs · 4 shirts</p>
    </div>
  </header>

  <section>
    <hgroup>
      <h2>01 — Isometric Grid</h2>
      <p>11 × 13 in · centre chest</p>
    </hgroup>
    <div class="pair">
      <figure>
        <div class="art" style="--ground: var(--garment-black)">
          <img src="{{IMG:tee-isogrid--black}}" alt="Isometric Grid tee on black: the City Edit logo grid built as an isometric city of grey blocks, with CITY and EDIT standing as solid amber volumes on raised plinths, above the line REDRAW YOUR CITY." />
        </div>
        <figcaption><b>Amber on black</b></figcaption>
      </figure>
      <figure>
        <div class="art" style="--ground: var(--garment-white)">
          <img src="{{IMG:tee-isogrid--white}}" alt="The same design on white: grey blocks and near-black letters." />
        </div>
        <figcaption><b>Grey on white</b></figcaption>
      </figure>
    </div>
  </section>

  <section>
    <hgroup>
      <h2>02 — One Note</h2>
      <p>11 × 11 in · centre chest · code points at one proposal</p>
    </hgroup>
    <div class="pair">
      <figure>
        <div class="art" style="--ground: var(--garment-black)">
          <img src="{{IMG:tee-one-note--black}}" alt="One Note tee on black: the line I, a heart, THIS CITY in large monospace capitals, then BUT I HAVE ONE NOTE, above a QR code knocked out of a white panel." />
        </div>
        <figcaption><b>White on black</b></figcaption>
      </figure>
      <figure>
        <div class="art" style="--ground: var(--garment-white)">
          <img src="{{IMG:tee-one-note--white}}" alt="The same design on white, with the code printed straight onto the fabric instead of inside a panel." />
        </div>
        <figcaption><b>Black on white</b></figcaption>
      </figure>
    </div>
  </section>

</div>
