<title>City Edit — Merch</title>

<style>
  @font-face {
    font-family: "Red Hat Mono";
    src: url("{{FONT}}") format("woff2");
    font-weight: 300 700;
    font-display: block;
  }

  /* Dark-first: this proofs a black-garment print for a product whose whole
     identity is a terminal. The light palette is the app's own light basemap
     theme, so a light-mode reader gets City Edit's other real skin. */
  :root {
    color-scheme: dark;
    --paper: #0d0d0d;
    --ink: #d4d4d4;
    --ink-strong: #ffffff;
    --ink-quiet: #86867e;
    --hairline: rgba(212, 212, 212, 0.28);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --paper: #f4f5f0;
      --ink: #2b2b28;
      --ink-strong: #000000;
      --ink-quiet: #6d6d64;
      --hairline: rgba(40, 40, 35, 0.3);
    }
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f4f5f0;
    --ink: #2b2b28;
    --ink-strong: #000000;
    --ink-quiet: #6d6d64;
    --hairline: rgba(40, 40, 35, 0.3);
  }

  /* Blank colours are product data — they hold in both themes, because they
     are what actually gets printed on. */
  :root {
    --garment-black: #17171a;
    --garment-natural: #e6e0d2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(36px, 7vw, 76px) clamp(16px, 5vw, 64px) clamp(48px, 8vw, 96px);
    background: var(--paper);
    color: var(--ink);
    font-family: "Red Hat Mono", ui-monospace, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vw, 52px);
  }

  header { display: flex; align-items: center; gap: 20px; }
  header .mark { width: clamp(52px, 8vw, 76px); color: var(--ink); flex: none; }
  header .mark svg { width: 100%; height: auto; display: block; }
  h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-strong);
  }
  h2 + p { margin: 2px 0 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-quiet); }

  section { display: flex; flex-direction: column; gap: clamp(18px, 3vw, 28px); }
  section > hgroup { padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }

  header h1 {
    margin: 0;
    font-size: clamp(20px, 3.4vw, 30px);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-strong);
  }
  header p {
    margin: 2px 0 0;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  figure .art { padding: clamp(14px, 3vw, 32px); background: var(--ground); }
  figure img { display: block; width: 100%; height: auto; }

  figcaption {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }
  figcaption::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  .alts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(20px, 3vw, 32px); }
  .alts figcaption b { color: var(--ink-strong); font-weight: 600; }
</style>

<div class="sheet">

  <header>
    <div class="mark">{{MARK}}</div>
    <div>
      <h1>Merch</h1>
      <p>City Edit · tees · 11 × 13 in</p>
    </div>
  </header>

  <section>
    <hgroup>
      <h2>01 — Isometric Grid</h2>
      <p>The logo grid, built as the street plan it always was</p>
    </hgroup>

    <figure>
      <div class="art" style="--ground: var(--garment-black)">
        <img src="{{IMG:tee-isogrid--black}}" alt="Isometric Grid tee: the City Edit logo grid built as an isometric city of grey blocks, with CITY and EDIT standing as solid volumes on raised plinths, above the line REDRAW YOUR CITY." />
      </div>
      <figcaption>Black</figcaption>
    </figure>

    <div class="alts">
      <figure>
        <div class="art" style="--ground: var(--garment-natural)">
          <img src="{{IMG:tee-isogrid--natural}}" alt="The same design on natural cotton: dark blocks and near-black letters on a pale ground." />
        </div>
        <figcaption><b>Natural</b></figcaption>
      </figure>
      <figure>
        <div class="art" style="--ground: var(--garment-black)">
          <img src="{{IMG:tee-isogrid--accent}}" alt="An option: the same design with the CITY EDIT letters in the brand amber instead of grey." />
        </div>
        <figcaption><b>Amber letters</b> — option</figcaption>
      </figure>
    </div>
  </section>

  <section>
    <hgroup>
      <h2>02 — One Note</h2>
      <p>A souvenir shirt at ten feet, a correction at five</p>
    </hgroup>

    <figure>
      <div class="art" style="--ground: var(--garment-black)">
        <img src="{{IMG:tee-one-note--black}}" alt="One Note tee: the words I, a heart, and THIS CITY stacked in large monospace capitals, then the smaller line BUT I HAVE ONE NOTE, above a QR code." />
      </div>
      <figcaption>Black</figcaption>
    </figure>

    <div class="alts">
      <figure>
        <div class="art" style="--ground: var(--garment-natural)">
          <img src="{{IMG:tee-one-note--natural}}" alt="The same design on natural cotton, with the code printed straight onto the fabric instead of inside a light panel." />
        </div>
        <figcaption><b>Natural</b></figcaption>
      </figure>
      <figure>
        <div class="art" style="--ground: var(--garment-black)">
          <img src="{{IMG:tee-one-note--line}}" alt="Layout alternate: I heart THIS CITY set on a single line instead of stacked." />
        </div>
        <figcaption><b>One line</b> — alternate</figcaption>
      </figure>
    </div>
  </section>

</div>
