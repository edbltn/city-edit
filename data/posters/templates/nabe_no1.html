<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600;700&display=swap');

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    position: relative;
    width: 850px;
    height: 1134px;
    overflow: hidden;
    background: #fff;
    font-family: 'Poppins', sans-serif;
  }

  .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 850px;
    height: 1134px;
    box-sizing: border-box;
    border: 3px solid #000;
    pointer-events: none;
    z-index: 10;
  }

  .pin {
    position: absolute;
    top: 30px;
    left: 250px;
    width: 400px;
  }

  #headline {
    position: absolute;
    top: 352px;
    left: 0;
    width: 850px;
    font-family: 'Luckiest Guy', cursive;
    color: #111;
    text-align: center;
    line-height: 1;
  }

  .hl-line {
    font-size: 47px;
    letter-spacing: 2px;
    margin: 0 0 14px;
  }

  #neighborhood {
    display: block;
    margin-top: 6px;
    font-family: 'Luckiest Guy', cursive;
    font-size: 124px;
    letter-spacing: 3px;
    color: #e91d24;
  }

  #statline {
    position: absolute;
    top: 648px;
    left: 0;
    width: 850px;
    font-size: 23px;
    font-weight: 600;
    color: #111;
    text-align: center;
  }

  .sign {
    position: absolute;
    top: 702px;
    left: 264px;
    width: 322px;
  }

  .burst-orange {
    position: absolute;
    top: 366px;
    left: 702px;
    width: 132px;
  }

  .burst-red {
    position: absolute;
    top: 506px;
    left: 12px;
    width: 108px;
  }

  .burst-yellow {
    position: absolute;
    top: 868px;
    left: 570px;
    width: 102px;
  }

  #cta {
    position: absolute;
    top: 1014px;
    left: 36px;
    width: 400px;
    font-size: 31px;
    line-height: 1.35;
    color: #111;
    text-align: center;
  }

  .arrow {
    position: absolute;
    top: 1054px;
    left: 466px;
    width: 172px;
  }

  #qr {
    position: absolute;
    top: 950px;
    left: 668px;
    width: 140px;
    height: 140px;
  }
