<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Poppins:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  body {
    width: 850px;
    height: 1134px;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Poppins', sans-serif;
  }

  .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 850px;
    height: 1134px;
    border: 3px solid #000;
    z-index: 10;
    pointer-events: none;
  }

  .abs { position: absolute; }

  #pin {
    top: 6px;
    left: 228px;
    width: 380px;
  }

  /* headline: family display face (Rubik Dirt), condensed like poster 2 */
  #headline {
    position: absolute;
    left: 0;
    top: 0;
    width: 850px;
    z-index: 2;
    font-family: 'Rubik Dirt', system-ui;
    color: #151515;
    text-align: center;
  }

  #headline .l1,
  #headline .l2 {
    position: absolute;
    left: 0;
    width: 850px;
    line-height: 1;
    white-space: nowrap;
  }

  #headline .l1 {
    top: 332px;
    font-size: 58px;
    word-spacing: 8px;
    transform: scaleX(0.78);
  }

  #headline .l2 {
    top: 402px;
    font-size: 104px;
    word-spacing: 8px;
    transform: scaleX(0.84);
  }

  #burst-orange { left: 706px; top: 298px; width: 126px; z-index: 1; }
  #burst-red { left: 8px; top: 380px; width: 118px; z-index: 1; }
  #burst-yellow { left: 565px; top: 912px; width: 102px; z-index: 1; }

  /* statline: same display face, black (red reserved for accents) */
  #statline {
    position: absolute;
    top: 838px;
    left: 45px;
    width: 760px;
    z-index: 2;
    font-family: 'Rubik Dirt', system-ui;
    font-size: 29px;
    line-height: 1.55;
    text-align: center;
    text-transform: uppercase;
    color: #151515;
    transform: scaleX(0.87);
  }

  #cta {
    position: absolute;
    top: 992px;
    left: 50px;
    width: 420px;
    z-index: 2;
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 36px;
    line-height: 1.42;
    text-align: center;
    color: #1a1a1a;
  }

  #cta b { font-weight: 600; }

  #arrow { left: 465px; top: 1040px; width: 200px; z-index: 1; }

  #qr {
    position: absolute;
    left: 688px;
    top: 962px;
    width: 132px;
    height: 132px;
    z-index: 2;
    image-rendering: pixelated;
    background: #fff;
  }
</style>
