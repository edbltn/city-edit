<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Oswald:wght@500;600&family=Poppins:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html,
  body {
    width: 850px;
    height: 1134px;
    overflow: hidden;
    background: #fff;
  }

  .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 850px;
    height: 1134px;
    border: 3px solid #000;
    z-index: 10;
    pointer-events: none;
  }

  .abs { position: absolute; }

  /* pin + gray speech-bubble shadow, re-cut from the reference page */
  #pinshadow { left: 244px; top: 17px; width: 463.6px; z-index: 1; }

  #statline {
    position: absolute;
    left: 339px;
    top: 86px;
    width: 170px;
    z-index: 3;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-align: center;
    color: #131313;
  }

  #statline .s1 {
    display: block;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 1.2px;
  }

  #statline .s2 {
    display: block;
    margin-top: 4px;
    margin-left: 1px;
    font-size: 44px;
    line-height: 1;
    letter-spacing: 1px;
  }

  #burst-orange { left: 666px; top: 364px; width: 160px; z-index: 1; }
  #burst-red { left: 0px; top: 512px; width: 193px; z-index: 1; }

  #headline {
    position: absolute;
    left: 0;
    top: 0;
    width: 850px;
    z-index: 2;
    font-family: 'Rubik Dirt', system-ui;
    color: #151515;
    text-align: center;
  }

  #headline .l1,
  #headline .l2,
  #headline .l3 {
    position: absolute;
    left: 0;
    width: 850px;
    line-height: 1;
    white-space: nowrap;
  }

  #headline .l1 {
    top: 364px;
    font-size: 56px;
    word-spacing: 9px;
    transform: translateX(-12px) scaleX(0.79);
  }

  #headline .l2 {
    top: 445px;
    font-size: 58px;
    word-spacing: 12px;
    transform: translateX(-11.5px) scaleX(0.74);
  }

  #headline .l3 {
    top: 525px;
    font-size: 52px;
    word-spacing: 10px;
    transform: translateX(-2.5px) scaleX(0.776);
  }

  /* diamond warning sign, cut from the reference */
  #sign { left: 222px; top: 596px; width: 406px; z-index: 1; }

  #burst-yellow { left: 598px; top: 910px; width: 173px; z-index: 1; }

  /* nearly-straight hand-drawn arrow, re-cut from the reference */
  #arrow { left: 461.5px; top: 1030px; width: 205.4px; z-index: 1; }

  #qr {
    position: absolute;
    left: 708.5px;
    top: 990.5px;
    width: 109px;
    height: 109px;
    z-index: 2;
    image-rendering: pixelated;
    background: #fff;
  }

  #cta {
    position: absolute;
    left: 68px;
    top: 998px;
    width: 360px;
    z-index: 2;
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 37px;
    line-height: 1.42;
    text-align: center;
    color: #1a1a1a;
  }

  #cta b { font-weight: 600; }
</style>
