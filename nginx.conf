events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;

    # Gzip compression — especially important for large JSON API responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    upstream flask {
        server flask:5001;
        keepalive 32;
        # Retire pooled connections BEFORE the backend's keep-alive (75s) does:
        # if gunicorn closes first, a request racing the FIN gets "upstream
        # prematurely closed" — and POSTs (votes) are never retried.
        keepalive_timeout 55s;
    }

    # Tile cache — /api/tile responses are immutable per archive bake (the URL
    # carries a ?v= cache-buster and a strong ETag); caching them here keeps
    # repeated viewports off Flask.
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:16m
                     max_size=512m inactive=7d use_temp_path=off;

    server {
        listen 80;

        # Content-hashed build assets — safe to cache forever (immutable).
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            # index.html / SPA shell must revalidate so new builds are picked up.
            add_header Cache-Control "no-cache";
        }

        location /api/tile/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache tiles;
            # 204 = empty tile (outside blocks coverage) — cache those too.
            proxy_cache_valid 200 204 7d;
            proxy_cache_key $uri$is_args$args$http_accept_encoding;
            # Collapse a cold-cache tile stampede to one upstream request per
            # tile; timeouts match /api/ — a lazy city graph load freezes the
            # single gevent worker for tens of seconds and would 504 at the
            # 60s default.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            add_header X-Tile-Cache $upstream_cache_status;
        }

        location /api/ {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://flask;
        }

        location /ws {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
