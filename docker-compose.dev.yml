# Development override - uses Vite with hot reload instead of Nginx
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  flask:
    deploy:
      replicas: 1
    ports:
      - "5001:5001"

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    # In-container Vite reaches Flask by its compose service name, not localhost.
    environment:
      - VITE_API_PROXY=http://flask:5001
    ports:
      - "3000:3000"
    volumes:
      - ./client-react:/app
      - /app/node_modules
    depends_on:
      - flask

  # Disable nginx in dev mode
  nginx:
    profiles:
      - production
